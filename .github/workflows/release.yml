name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

# Actions are pinned by commit SHA; write access and the npm token are scoped to this one job.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the "Version Packages" commit
      pull-requests: write # the "Version Packages" PR
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # the same gate as CI: nothing is published from a main that doesn't pass it
      - run: pnpm exec biome ci .
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm turbo run typecheck test build size check-exports
      # Opens/updates "Version Packages" while changesets are pending; publishes once that PR is merged.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
